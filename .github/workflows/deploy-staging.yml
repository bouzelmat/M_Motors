name: Deploy staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  AWS_REGION: eu-west-3
  TF_DIR: backend/infra/terraform

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      # id-token: write # Décommentez si vous passez à l'authentification OIDC à l'avenir
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.CI_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.CI_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init, workspace and import ECR
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init
          terraform workspace select staging || terraform workspace new staging
          
          # Mécanique d'importation idempotente : vérifie si la ressource est déjà dans l'état
          if terraform state show aws_ecr_repository.backend > /dev/null 2>&1; then
            echo "✅ Le dépôt ECR est déjà connu de Terraform. Import ignoré."
          else
            echo "⚠️ Le dépôt ECR n'est pas dans l'état. Importation de la ressource manuelle en cours..."
            terraform import aws_ecr_repository.backend m-motors/backend
          fi
          
          # Synchronisation : applique uniquement les différences de config (ex: scan_on_push)
          terraform apply -auto-approve -target=aws_ecr_repository.backend

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$REGISTRY/m-motors/backend:$IMAGE_TAG"
          docker build -t "$IMAGE_URI" -f backend/Dockerfile backend
          docker push "$IMAGE_URI"

      - name: Terraform apply infrastructure
        working-directory: ${{ env.TF_DIR }}
        env:
          BUDGET_EMAIL: ${{ secrets.BUDGET_ALERT_EMAIL }}
        run: |
          BUDGET_ARG=""
          if [ -n "$BUDGET_EMAIL" ]; then BUDGET_ARG="-var=budget_alert_email=$BUDGET_EMAIL"; fi
          
          terraform apply -auto-approve \
            -var="image_tag=${{ github.sha }}" \
            $BUDGET_ARG

      - name: Export Terraform Outputs to GitHub Environment
        working-directory: ${{ env.TF_DIR }}
        id: tf-outputs
        run: |
          # Extraction sécurisée des métadonnées sans changer de contexte de répertoire
          echo "ecs_url=$(terraform output -raw ecs_express_service_url)" >> $GITHUB_OUTPUT
          echo "frontend_bucket=$(terraform output -raw frontend_bucket_name)" >> $GITHUB_OUTPUT
          echo "cloudfront_id=$(terraform output -raw frontend_cloudfront_distribution_id)" >> $GITHUB_OUTPUT

      - name: Build frontend and publish to S3
        working-directory: frontend
        env:
          # Injection déterministe des variables extraites à l'étape précédente
          VITE_API_BASE_URL: "https://${{ steps.tf-outputs.outputs.ecs_url }}"
        run: |
          npm ci
          npm run build
          
          # Synchronisation vers le bucket
          aws s3 sync dist/ "s3://${{ steps.tf-outputs.outputs.frontend_bucket }}" --delete
          
          # Invalidation du cache CloudFront
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf-outputs.outputs.cloudfront_id }}" \
            --paths '/*'