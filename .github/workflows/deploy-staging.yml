name: Deploy staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  AWS_REGION: eu-west-3
  TF_DIR: backend/infra/terraform

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.CI_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.CI_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init and select workspace
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init
          terraform workspace select staging || terraform workspace new staging
          terraform apply -auto-approve -target=aws_ecr_repository.backend

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$REGISTRY/m-motors/backend:$IMAGE_TAG"
          docker build -t "$IMAGE_URI" -f backend/Dockerfile backend
          docker push "$IMAGE_URI"

      - name: Terraform apply infrastructure
        working-directory: ${{ env.TF_DIR }}
        env:
          BUDGET_EMAIL: ${{ secrets.BUDGET_ALERT_EMAIL }}
        run: |
          BUDGET_ARG=""
          if [ -n "$BUDGET_EMAIL" ]; then BUDGET_ARG="-var=budget_alert_email=$BUDGET_EMAIL"; fi
          terraform apply -auto-approve \
            -var="image_tag=${{ github.sha }}" \
            $BUDGET_ARG

      - name: Build frontend and publish to S3
        working-directory: frontend
        run: |
          npm ci
          VITE_API_BASE_URL="https://$(cd ../${TF_DIR} && terraform output -raw ecs_express_service_url)" \
            npm run build
          aws s3 sync dist/ "s3://$(cd ../${TF_DIR} && terraform output -raw frontend_bucket_name)" --delete
          aws cloudfront create-invalidation \
            --distribution-id "$(cd ../${TF_DIR} && terraform output -raw frontend_cloudfront_distribution_id)" \
            --paths '/*'
