name: Deploy production

on:
  workflow_dispatch:

env:
  AWS_REGION: eu-west-3
  TF_DIR: backend/infra/terraform

jobs:
  deploy:
    name: Deploy production on AWS
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.CI_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.CI_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform and select workspace
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init
          terraform workspace select production || terraform workspace new production
          terraform apply -auto-approve -target=aws_ecr_repository.backend

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$REGISTRY/m-motors/backend:$IMAGE_TAG"
          docker build -t "$IMAGE_URI" -f backend/Dockerfile backend
          docker push "$IMAGE_URI"

      - name: Apply the complete production infrastructure
        working-directory: ${{ env.TF_DIR }}
        env:
          BUDGET_EMAIL: ${{ secrets.BUDGET_ALERT_EMAIL }}
          MONITORING_EMAIL: ${{ secrets.MONITORING_ALERT_EMAIL }}
        run: |
          BUDGET_ARG=""
          if [ -n "$BUDGET_EMAIL" ]; then
            BUDGET_ARG="-var=budget_alert_email=$BUDGET_EMAIL"
          fi
          MONITORING_ARG=""
          if [ -n "$MONITORING_EMAIL" ]; then
            MONITORING_ARG="-var=monitoring_alert_email=$MONITORING_EMAIL"
          fi
          terraform apply -auto-approve \
            -var="image_tag=${{ github.sha }}" \
            $BUDGET_ARG \
            $MONITORING_ARG

      - name: Build frontend and publish to S3
        working-directory: frontend
        run: |
          npm ci
          VITE_API_BASE_URL="https://$(cd ../${TF_DIR} && terraform output -raw ecs_express_service_url)" \
            npm run build
          aws s3 sync dist/ \
            "s3://$(cd ../${TF_DIR} && terraform output -raw frontend_bucket_name)" \
            --delete
          aws cloudfront create-invalidation \
            --distribution-id "$(cd ../${TF_DIR} && terraform output -raw frontend_cloudfront_distribution_id)" \
            --paths '/*'