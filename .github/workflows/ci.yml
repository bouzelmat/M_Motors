name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend:
    name: Backend quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: m_motors
          POSTGRES_PASSWORD: m_motors
          POSTGRES_DB: test_m_motors
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      # ==========================================
      # ETAPE CRITIQUE : Migration de la base de données de test
      # ==========================================
      - name: Run Alembic Migrations
        env:
          # Variable non sensible : safe en dur
          ENVIRONMENT: development
          # URL de test CI locale : safe en dur (base éphémère)
          DATABASE_URL: postgresql+asyncpg://m_motors:m_motors@localhost:5432/test_m_motors
          # SECRET : Injecté via GitHub Secrets
          SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
          # Variables S3 non sensibles
          S3_BUCKET_NAME: m-motors-photos-test
          S3_DOCUMENTS_BUCKET_NAME: m-motors-documents-test
          AWS_REGION: eu-west-3
          # Credentials S3 : Injectés via GitHub Secrets (même si c'est "testing" pour Moto)
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: http://localhost:9090
        run: alembic upgrade head

      - name: Pytest
        env:
          ENVIRONMENT: development
          DATABASE_URL: postgresql+asyncpg://m_motors:m_motors@localhost:5432/test_m_motors
          SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
          S3_BUCKET_NAME: m-motors-photos-test
          S3_DOCUMENTS_BUCKET_NAME: m-motors-documents-test
          AWS_REGION: eu-west-3
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: http://localhost:9090
        run: pytest --cov=src --cov-report=term-missing

      # ==========================================
      # ETAPE 2 : GENERATION DU TOKEN DE TEST POUR ZAP
      # ==========================================
      - name: Générer un jeton JWT de test pour ZAP
        env:
          ENVIRONMENT: development
          # Seul le SECRET_KEY est nécessaire ici, mais on le passe proprement
          SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
        run: |
          cat << 'EOF' > generate_zap_token.py
          import json
          from src.auth.infrastructure.security.jwt_service import JWTService
          
          jwt_service = JWTService()
          # CORRECTION CONFIRMÉE : create_access_token
          token = jwt_service.create_access_token(data={"sub": "zap-test-user-id", "role": "admin"})
          
          zap_auth_header = [{"header": f"Authorization: Bearer {token}"}]
          with open("zap_headers.json", "w") as f:
              json.dump(zap_auth_header, f)
          print("Jeton ZAP généré avec succès.")
          EOF
          
          PYTHONPATH=. python generate_zap_token.py

      - name: Lancer FastAPI en arrière-plan pour le scan
        env:
          ENVIRONMENT: development
          DATABASE_URL: postgresql+asyncpg://m_motors:m_motors@localhost:5432/test_m_motors
          SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
          S3_BUCKET_NAME: m-motors-photos-test
          S3_DOCUMENTS_BUCKET_NAME: m-motors-documents-test
          AWS_REGION: eu-west-3
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: http://localhost:9090
          PYTHONPATH: .
        run: |
          uvicorn src.api.main:app --host 0.0.0.0 --port 8000 &
          echo "Attente du démarrage de FastAPI..."
          # CORRECTION CONFIRMÉE : URL de healthcheck complète et valide
          timeout 30s sh -c 'until curl --silent http://127.0.0.1:8000/health > /dev/null; do sleep 1; done'
          echo "FastAPI est prêt !"

      - name: Exécuter le Scan d'API OWASP ZAP Authentifié
        run: |
          mkdir -p ${{ github.workspace }}/zap-reports
          
          # Le working-directory est 'backend', donc le fichier est à backend/zap_headers.json
          TOKEN_RAW=$(cat zap_headers.json | grep -oP 'Bearer \K[^"]+')
          
          docker run --rm \
            -v ${{ github.workspace }}:/zap/wrk/:rw \
            --network="host" \
            zaproxy/zap-stable zap-api-scan.py \
            -t http://localhost:8000/openapi.json \
            -f openapi \
            -c /zap/wrk/backend/.zap/rules.tsv \
            -z "-config replacer.full_list\(0\).description=Auth \
                -config replacer.full_list\(0\).enabled=true \
                -config replacer.full_list\(0\).matchtype=REQ_HEADER \
                -config replacer.full_list\(0\).matchstr=Authorization \
                -config replacer.full_list\(0\).regex=false \
                -config replacer.full_list\(0\).replacement='Bearer '$TOKEN_RAW" \
            -r rapport_api_zap.html || true
          
          mv ${{ github.workspace }}/rapport_api_zap.html ${{ github.workspace }}/zap-reports/rapport_api_zap.html

      - name: Sauvegarder le rapport de sécurité ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-securite-api-owasp
          path: ${{ github.workspace }}/zap-reports/rapport_api_zap.html

  frontend:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: npm install

      - name: Vitest
        run: npm run test