name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend:
    name: Backend quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: m_motors
          POSTGRES_PASSWORD: m_motors
          POSTGRES_DB: test_m_motors
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Pytest
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://m_motors:m_motors@localhost:5432/test_m_motors
        run: pytest --cov=src --cov-report=term-missing

      # ==========================================
      # ETAPE 2 : GENERATION DU TOKEN DE TEST POUR ZAP
      # ==========================================
      - name: Générer un jeton JWT de test pour ZAP
        run: |
          cat << 'EOF' > generate_zap_token.py
          import json
          from src.auth.infrastructure.security.jwt_service import JWTService
          
          # Crée un token valide simulant l'utilisateur de test 'zap-scanner'
          jwt_service = JWTService()
          token = jwt_service.create_token(data={"sub": "zap-test-user-id", "role": "admin"})
          
          # On écrit la configuration de header au format attendu par OWASP ZAP
          zap_auth_header = [{"header": f"Authorization: Bearer {token}"}]
          with open("zap_headers.json", "w") as f:
              json.dump(zap_auth_header, f)
          print("Jeton ZAP généré avec succès.")
          EOF
          
          # Exécution du script en utilisant le contexte Python existant
          PYTHONPATH=. python generate_zap_token.py

      - name: Lancer FastAPI en arrière-plan pour le scan
        env:
          DATABASE_URL: postgresql+asyncpg://m_motors:m_motors@localhost:5432/test_m_motors
          PYTHONPATH: .
        run: |
          uvicorn src.api.main:app --host 0.0.0.0 --port 8000 &
          echo "Attente du démarrage de FastAPI..."
          timeout 30s sh -c 'until curl --silent http://127.0.0 > /dev/null; do sleep 1; done'
          echo "FastAPI est prêt !"

      - name: Exécuter le Scan d'API OWASP ZAP Authentifié
        run: |
          mkdir -p ${{ github.workspace }}/zap-reports
          
          # On extrait la chaîne brute du jeton pour la passer à la configuration de remplacement de ZAP
          TOKEN_RAW=$(cat zap_headers.json | grep -oP 'Bearer \K[^"]+')
          
          # Exécution du conteneur ZAP branché sur le réseau du runner de GitHub avec le fichier de règles
          docker run --rm \
            -v ${{ github.workspace }}:/zap/wrk/:rw \
            --network="host" \
            zaproxy/zap-stable zap-api-scan.py \
            -t http://localhost:8000/openapi.json \
            -f openapi \
            -c /zap/wrk/.zap/rules.tsv \
            -z "-config replacer.full_list\(0\).description=Auth \
                -config replacer.full_list\(0\).enabled=true \
                -config replacer.full_list\(0\).matchtype=REQ_HEADER \
                -config replacer.full_list\(0\).matchstr=Authorization \
                -config replacer.full_list\(0\).regex=false \
                -config replacer.full_list\(0\).replacement='Bearer '$TOKEN_RAW" \
            -r rapport_api_zap.html || true
          
          # On déplace le rapport généré vers le bon dossier pour l'artefact
          mv ${{ github.workspace }}/rapport_api_zap.html ${{ github.workspace }}/zap-reports/rapport_api_zap.html

      - name: Sauvegarder le rapport de sécurité ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-securite-api-owasp
          path: zap-reports/rapport_api_zap.html

  frontend:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: npm install

      - name: Vitest
        run: npm run test
