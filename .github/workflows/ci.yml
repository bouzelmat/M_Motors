name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend:
    name: Backend quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: m_motors
          POSTGRES_PASSWORD: m_motors
          POSTGRES_DB: test_m_motors
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      # ==========================================
      # ETAPE CRITIQUE : Migration de la base de données de test
      # ==========================================
      - name: Run Alembic Migrations
        env:
          ENVIRONMENT: development
          DATABASE_URL: postgresql+asyncpg://m_motors:m_motors@localhost:5432/test_m_motors
          SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
          S3_BUCKET_NAME: m-motors-photos-test
          S3_DOCUMENTS_BUCKET_NAME: m-motors-documents-test
          AWS_REGION: eu-west-3
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: http://localhost:9090
        run: alembic upgrade head

      - name: Pytest
        env:
          ENVIRONMENT: development
          DATABASE_URL: postgresql+asyncpg://m_motors:m_motors@localhost:5432/test_m_motors
          SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
          S3_BUCKET_NAME: m-motors-photos-test
          S3_DOCUMENTS_BUCKET_NAME: m-motors-documents-test
          AWS_REGION: eu-west-3
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: http://localhost:9090
        run: pytest --cov=src --cov-report=term-missing

      - name: Recréer le schéma pour le scan ZAP
        env:
          ENVIRONMENT: development
          DATABASE_URL: postgresql+asyncpg://m_motors:m_motors@localhost:5432/test_m_motors
          SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
          S3_BUCKET_NAME: m-motors-photos-test
          S3_DOCUMENTS_BUCKET_NAME: m-motors-documents-test
          AWS_REGION: eu-west-3
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: http://localhost:9090
        run: |
          # Pytest supprime les tables ORM en fin de session, mais conserve
          # alembic_version. Il faut donc réinitialiser le schéma avant de
          # relancer Alembic, sinon `upgrade head` est considéré comme déjà fait.
          PGPASSWORD=m_motors psql \
            --host=localhost \
            --port=5432 \
            --username=m_motors \
            --dbname=test_m_motors \
            --command='DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
          alembic upgrade head

      # ==========================================
      # ETAPE 2 : CREATION DE L'UTILISATEUR ET DU TOKEN DE TEST POUR ZAP
      # ==========================================
      - name: Créer un utilisateur de test pour ZAP
        env:
          ENVIRONMENT: development
          DATABASE_URL: postgresql+asyncpg://m_motors:m_motors@localhost:5432/test_m_motors
          SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
          S3_BUCKET_NAME: m-motors-photos-test
          S3_DOCUMENTS_BUCKET_NAME: m-motors-documents-test
          AWS_REGION: eu-west-3
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: http://localhost:9090
          PYTHONPATH: .
        run: |
          cat << 'EOF' > create_zap_user.py
          import asyncio
          from uuid import UUID

          from sqlalchemy.ext.asyncio import async_sessionmaker, create_async_engine

          from src.auth.infrastructure.orm.user_model import UserModel

          DATABASE_URL = "postgresql+asyncpg://m_motors:m_motors@localhost:5432/test_m_motors"
          ZAP_USER_ID = UUID("00000000-0000-0000-0000-000000000001")

          async def main() -> None:
              engine = create_async_engine(DATABASE_URL)
              session_factory = async_sessionmaker(bind=engine, expire_on_commit=False)

              async with session_factory() as session:
                  session.add(
                      UserModel(
                          id=str(ZAP_USER_ID),
                          email="zap-test@example.com",
                          hashed_password="not-a-real-password-hash",
                          first_name="ZAP",
                          last_name="Test",
                          role="ADMIN",
                          is_active=True,
                      )
                  )
                  await session.commit()

              await engine.dispose()
              print(f"Utilisateur ZAP créé : {ZAP_USER_ID}")

          asyncio.run(main())
          EOF
          python create_zap_user.py

      - name: Générer un jeton JWT de test pour ZAP
        env:
          ENVIRONMENT: development
          DATABASE_URL: postgresql+asyncpg://m_motors:m_motors@localhost:5432/test_m_motors
          SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
          S3_BUCKET_NAME: m-motors-photos-test
          S3_DOCUMENTS_BUCKET_NAME: m-motors-documents-test
          AWS_REGION: eu-west-3
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: http://localhost:9090
        run: |
          cat << 'EOF' > generate_zap_token.py
          import json
          from src.auth.infrastructure.security.jwt_service import JWTService
          
          jwt_service = JWTService()
          token = jwt_service.create_access_token(
              data={
                  "sub": "00000000-0000-0000-0000-000000000001",
                  "role": "admin",
              }
          )
          
          zap_auth_header = [{"header": f"Authorization: Bearer {token}"}]
          with open("zap_headers.json", "w") as f:
              json.dump(zap_auth_header, f)
          print("Jeton ZAP généré avec succès.")
          EOF
          
          PYTHONPATH=. python generate_zap_token.py

      - name: Lancer FastAPI en arrière-plan pour le scan
        env:
          ENVIRONMENT: development
          DATABASE_URL: postgresql+asyncpg://m_motors:m_motors@localhost:5432/test_m_motors
          SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
          S3_BUCKET_NAME: m-motors-photos-test
          S3_DOCUMENTS_BUCKET_NAME: m-motors-documents-test
          AWS_REGION: eu-west-3
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: http://localhost:9090
          PYTHONPATH: .
        run: |
          uvicorn src.api.main:app --host 0.0.0.0 --port 8000 &
          echo "Attente du démarrage de FastAPI..."
          timeout 30s sh -c 'until curl --silent http://127.0.0.1:8000/health > /dev/null; do sleep 1; done'
          echo "FastAPI est prêt !"

      - name: Exécuter le Scan d'API OWASP ZAP Authentifié
        id: zap_scan
        continue-on-error: true
        run: |
          # 1. Création propre du dossier d'artefact à la racine globale
          mkdir -p ${{ github.workspace }}/zap-reports

          # 2. Extraction du token depuis le fichier situé dans backend/
          TOKEN_RAW=$(cat zap_headers.json | grep -oP 'Bearer \K[^"]+')

          # 3. Exécution avec le fichier de règles + option -l FAIL
          docker run --rm \
            --user root \
            -v ${{ github.workspace }}:/zap/wrk/:rw \
            --network="host" \
            zaproxy/zap-stable zap-api-scan.py \
            -t http://localhost:8000/openapi.json \
            -f openapi \
            -c /zap/wrk/.zap/rules.tsv \
            -l FAIL \
            -z "-config replacer.full_list\(0\).description=Auth \
                -config replacer.full_list\(0\).enabled=true \
                -config replacer.full_list\(0\).matchtype=REQ_HEADER \
                -config replacer.full_list\(0\).matchstr=Authorization \
                -config replacer.full_list\(0\).regex=false \
                -config replacer.full_list\(0\).replacement='Bearer '$TOKEN_RAW" \
            -r zap-reports/rapport_api_zap.html || true

      - name: Sauvegarder le rapport de sécurité ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-securite-api-owasp
          path: ${{ github.workspace }}/zap-reports/rapport_api_zap.html

      - name: Vérifier les alertes ZAP critiques
        if: always()
        run: |
          REPORT_FILE="${{ github.workspace }}/zap-reports/rapport_api_zap.html"

          if [ ! -f "$REPORT_FILE" ]; then
            echo "❌ Le rapport ZAP n'a pas été généré."
            exit 1
          fi

          # Extraire le nombre d'alertes High depuis le tableau récapitulatif
          HIGH_COUNT=$(grep -oP '<td>High</td>\s*<td>\K[0-9]+' "$REPORT_FILE" | head -1 || echo "0")

          echo "=========================================="
          echo "Résumé des alertes ZAP :"
          echo "  High : $HIGH_COUNT"
          echo "=========================================="

          if [ "$HIGH_COUNT" -gt 0 ]; then
            echo "❌ ÉCHEC : $HIGH_COUNT alerte(s) de niveau High détectée(s)."
            echo "Consultez le rapport : $REPORT_FILE"
            echo "Voir l'artefact 'rapport-securite-api-owasp' dans ce workflow."
            exit 1
          fi

          echo "✅ Aucune alerte High détectée. Pipeline autorisé à continuer."

  frontend:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: npm install

      - name: Vitest
        run: npm run test