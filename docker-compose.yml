services:
  s3mock:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: m-motors-documents,m-motors-photos
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - s3mock_data:/s3mockroot
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/favicon.ico"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3-proxy:
    image: nginx:alpine
    depends_on:
      s3mock:
        condition: service_healthy
    volumes:
      - ./backend/infra/s3/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:9000:8080"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: m_motors
      POSTGRES_USER: m_motors
      POSTGRES_PASSWORD: m_motors
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U m_motors -d m_motors"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://m_motors:m_motors@db:5432/m_motors
      PYTHONPATH: /app
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_ENDPOINT_URL: http://s3mock:9090
      AWS_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_BUCKET_NAME: m-motors-photos
      S3_DOCUMENTS_BUCKET_NAME: m-motors-documents
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic:ro
      - ./backend/scripts:/app/scripts:ro
    depends_on:
      db:
        condition: service_healthy
      s3mock:
        condition: service_healthy
      s3-proxy:
        condition: service_started
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  s3mock_data: