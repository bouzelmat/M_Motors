line-length = 88
target-version = "py312"

[lint]
select = ["E", "F", "I", "B", "BLE", "S"]
ignore = ["E501", "S105", "S106", "I001"]

[lint.per-file-ignores]
"src/**/api/**/*.py" = ["B008"]
"src/**/infrastructure/dependencies.py" = ["B008"]
"src/api/rest/*.py" = ["B008"]

"scripts/**/*" = ["E402"]
"tests/**/*" = ["E402", "BLE001", "S110", "S101", "B008"]