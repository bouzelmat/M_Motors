[tool.poetry]
name = "m-motors-backend"
version = "0.1.0"
description = "Backend API for M-Motors"
authors = ["M-Motors <dev@m-motors.local>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { version = "^0.30.0", extras = ["standard"] }
sqlalchemy = "^2.0.0"
psycopg = { version = "^3.2.0", extras = ["binary"] }
pydantic = "^2.8.0"
pydantic-settings = "^2.4.0"
passlib = { version = "^1.7.4", extras = ["bcrypt"] }
python-jose = { version = "^3.3.0", extras = ["cryptography"] }
python-multipart = "^0.0.9"

[tool.poetry.group.dev.dependencies]
alembic = "^1.13.0"
black = "^24.8.0"
httpx = "^0.27.0"
pytest = "^8.3.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"
ruff = "^0.6.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]